<style>

urrent=page]{border-color:var(--gold)}.wrap{max-width:1480px;margin:auto;padding:32px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.heading p{margin-top:10px}.heading .meta{font:13px ui-monospace,monospace;text-align:right;color:var(--muted)}.workspace{display:grid;grid-template-columns:162px minmax(0,1fr) 280px;gap:24px;align-items:start}.steps{display:grid;gap:7px}.steps button{text-align:left;background:transparent;border:1px solid transparent;padding:10px;font-size:14px;display:flex;gap:12px;align-items:center}.steps button[aria-current=step]{border-color:var(--gold);background:#e5cc9210}.steps button span{font:12px ui-monospace,monospace;color:var(--muted)}.steps button[aria-current=step] span{color:var(--gold)}.steps .foot{padding:20px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px}.panel{border:1px solid var(--line);background:linear-gradient(135deg,#152532b3,#111e29);padding:24px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.section-head p{margin-top:7px}.toolbar{display:flex;gap:12px;align-items:center;margin:22px 0 18px}.toolbar label{flex:1}input,select,textarea{padding:10px 12px;width:100%}label{display:grid;gap:7px;font-size:14px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.origin-card{text-align:left;padding:20px;min-height:155px;position:relative;border-color:var(--line);background:#0a141e88;display:flex;flex-direction:column;align-items:start;gap:8px}.origin-card strong{font-family:Georgia,serif;font-weight:400;font-size:25px;line-height:1.2}.origin-card .card-icon{font-size:24px;color:var(--gold)}.origin-card small{color:var(--muted);font-weight:400}.origin-card[aria-pressed=true]:after{content:'✓ Escolhida';font:12px system-ui;color:var(--gold);position:absolute;right:12px;top:14px}.note{font-size:14px;color:var(--muted);padding:14px 0;margin-top:16px}.actions{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding-top:22px;margin-top:24px}.primary{background:var(--gold);color:#14212b;border-color:var(--gold)}.primary:hover{background:#f2dda8;color:#14212b}.ghost{background:transparent}.dossier{padding:22px;background:#0e1923;border:1px solid var(--line);position:sticky;top:24px}.portrait{height:124px;margin:16px 0 20px;display:grid;place-items:center;background:radial-gradient(circle,#32495999,#111e29 70%);border:1px solid var(--line);position:relative;overflow:hidden}.portrait:before,.portrait:after{content:'';position:absolute;border:1px solid #e5cc9240;width:92px;height:92px;border-radius:50%}.portrait:after{width:165px;height:165px}.portrait span{font:60px Georgia;color:var(--gold)}.dossier h2{font-size:26px}.tag{display:inline-block;padding:3px 8px;color:var(--green);border:1px solid #607a70;font-size:12px}.divider{border:0;border-top:1px solid var(--line);margin:20px 0}.facts{display:grid;gap:12px}.facts div{display:flex;justify-content:space-between;gap:15px;font-size:14px}.facts dt{color:var(--muted)}.facts dd{margin:0;text-align:right}.detail-title{color:var(--gold);font-size:23px;margin:8px 0}.benefit{padding-left:18px;color:var(--muted);font-size:14px}.benefit li{margin:8px 0}.example{font-size:12px;color:var(--muted);margin-top:20px}.split{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}.tabnav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}.tabnav button{background:transparent}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.form-grid .wide{grid-column:1/-1}.callout{padding:18px;border-left:3px solid var(--gold);background:#e5cc920b;color:var(--muted);font-size:14px}.statrow{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.stat{text-align:center;padding:12px 4px;background:var(--panel);border:1px solid var(--line)}.stat strong{font:30px Georgia;display:block;color:var(--ink)}.stat span{font-size:12px;color:var(--muted)}.resources{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 26px}.resource{padding:20px;background:var(--panel);border:1px solid var(--line)}.resource-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.resource-head strong{font:32px Georgia}.resource-head strong span{font:16px system-ui;color:var(--muted)}.bar{height:5px;background:#465966;margin:15px 0}.bar i{display:block;height:100%;background:var(--gold)}.resource:nth-child(2) .bar i{background:#adbeda}.resource:nth-child(3) .bar i{background:var(--green)}.resource-controls{display:flex;gap:8px;align-items:center;justify-content:space-between}.resource-controls button{font-size:20px;min-width:46px;padding:4px}.resource-controls span{font-size:12px;color:var(--muted)}.loadout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:24px}.itemlist{display:grid;gap:10px}.item{display:flex;text-align:left;align-items:center;gap:20px;padding:20px}.item .icon{width:48px;height:48px;display:grid;place-items:center;background:#e5cc9212;color:var(--gold);font-size:27px;flex-shrink:0}.item strong{display:block;font-size:17px}.item small{display:block;font-weight:400;margin-top:4px;color:var(--muted)}.item .quantity{margin-left:auto;color:var(--gold);font-size:13px}.evo-top{display:flex;justify-content:space-between;align-items:center;background:#0c1721;padding:24px;border:1px solid var(--line);margin:24px 0}.level{font:52px Georgia;line-height:1.2}.evo-top .arrow{font-size:28px;color:var(--gold)}.choice{display:flex;align-items:center;gap:20px;justify-content:space-between;padding:20px;text-align:left;width:100%;margin-top:12px}.choice small{display:block;font-weight:400;color:var(--muted);margin-top:4px}.check{border:1px solid var(--gold);width:24px;height:24px;display:grid;place-items:center;color:var(--gold);flex-shrink:0}.stack{display:grid;gap:20px}.footer{max-width:1416px;margin:12px auto 0;padding:20px 0 30px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:12px}.empty{padding:28px;border:1px dashed var(--line);grid-column:1/-1;color:var(--muted)}#notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:#e5cc92;color:#14212b;padding:13px 22px;box-shadow:0 8px 40px #0009;border-radius:3px;z-index:5;font-size:14px}#notice:empty{display:none}.skip{position:absolute;left:16px;top:-100px;padding:12px;background:var(--gold);color:var(--bg);z-index:8}.skip:focus{top:10px}.inline-link{background:none;border:0;text-decoration:underline;color:var(--gold);padding:0;font-size:14px}.number-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.number-grid label{text-align:center}.number-grid input{text-align:center}.scene-intro{max-width:650px;margin:14px 0 26px;color:var(--muted)}
@media(max-width:1150px){.workspace{grid-template-columns:140px minmax(0,1fr)}.workspace>.dossier{grid-column:2;position:static}.split{grid-template-columns:minmax(0,1fr) 270px}.wrap{padding:26px 22px}.top{padding:20px 22px}.footer{margin-inline:22px}.cards{gap:10px}.origin-card{padding:16px}}
@media(max-width:760px){.top{display:block;padding:18px 16px}.brand{margin-bottom:18px}.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.scenes button{padding:9px 3px;font-size:12px}.wrap{padding:24px 16px}.heading{align-items:start}.heading .meta{display:none}.workspace,.split,.loadout{display:block}.workspace>.dossier{margin-top:20px}.steps{display:flex;overflow-x:auto;gap:6px;padding:2px 2px 14px;margin-bottom:16px}.steps button{flex-shrink:0;min-height:46px;padding:10px}.steps .foot{display:none}.panel{padding:20px 16px}.dossier{position:static;margin-top:20px;padding:20px}.cards{gap:10px}.origin-card{padding:16px 12px;min-height:170px}.origin-card strong{font-size:22px}.origin-card[aria-pressed=true]:after{position:static;order:4}.toolbar{display:block}.toolbar select{margin-top:12px}.section-head{align-items:start}.section-head .tag{white-space:nowrap}.heading{margin-bottom:22px}.form-grid{grid-template-columns:1fr}.form-grid .wide{grid-column:auto}.resources{gap:8px}.resource{padding:12px 8px}.resource-head{display:block}.resource-head .eyebrow{font-size:10px;letter-spacing:.04em}.resource-head strong{display:block;font-size:29px}.resource-controls{flex-wrap:wrap;gap:4px}.resource-controls span{order:3;width:100%;font-size:10px;text-align:center}.resource-controls button{min-width:46px;padding:3px}.tabnav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.tabnav button{padding:9px 4px;font-size:13px}.item{padding:14px 10px;gap:12px}.item .icon{width:38px}.item .quantity{display:none}.footer{margin:12px 16px;display:block}.footer span{display:block;margin-top:8px}.actions{align-items:stretch}.actions button{padding:10px 14px}.number-grid{gap:6px}.number-grid input{padding:8px 2px}.evo-top{padding:18px}.choice{padding:16px}.studybar{padding:8px 16px;font-size:12px}.portrait{height:96px}.scene-intro{margin-bottom:20px}}
@media(prefers-reduced-motion:no-preference){button{transition:background .15s,border-color .15s}}@media print{.studybar,.top,.steps,.actions,.footer{display:none}.wrap{padding:0}.workspace,.split,.loadout{display:block}body{background:#fff;color:#111}.panel,.dossier{background:#fff;color:#111;margin-bottom:20px;break-inside:avoid}}

<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<div class="studybar">ESTUDO VISUAL 01 · Proposta independente · Dados fictícios · Nenhuma alteração na sua ficha</div>
<header class="top"><div class="brand"><span class="sigil" aria-hidden="true">✧</span><div>ÓRION<br><small>ARQUIVO DE AGENTES</small></div></div><nav class="scenes" aria-label="Telas do estudo"><button data-scene="criacao" aria-current="page">01 Criação</button><button data-scene="oficina">02 Oficina</button><button data-scene="evolucao">03 Evolução</button><button data-scene="jogo">04 Jogo</button></nav></header>
<main id="main" class="wrap" tabindex="-1"></main>
<footer class="footer"><span>ÓRION / DIREÇÃO VISUAL — ARQUIVO PARANORMAL TÁTICO</span><span>Revisão 01 · HTML independente · <a href="PESQUISA.md">Notas da pesquisa</a></span></footer>
<div id="notice" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const steps=['Identidade','Estágio da vida','Classe','Atributos','Origem','Perícias','Habilidades','Rituais','Revisão'];
const origins=[{name:'Linha de Frente',icon:'◈',group:'Combate',text:'Você aprendeu a manter a posição quando todos recuam.',skills:'Fortitude e Luta',detail:'Uma história de coragem, disciplina e decisões difíceis.'},{name:'Acadêmico',icon:'⌘',group:'Conhecimento',text:'Respostas deixam rastros. Você sabe onde procurá-los.',skills:'Ciências e Investigação',detail:'Livros, documentos e pesquisa fazem parte da sua história.'},{name:'Artista',icon:'✺',group:'Expressão',text:'Você vê possibilidades onde os outros veem o comum.',skills:'Artes e Enganação',detail:'Sua expressão criativa acompanha o agente que você se tornou.'},{name:'Atleta',icon:'⟐',group:'Combate',text:'Treino, resistência e vontade de ir um pouco além.',skills:'Acrobacia e Atletismo',detail:'Seu passado foi moldado pelo esforço e pela superação.'},{name:'Agente de Saúde',icon:'✚',group:'Conhecimento',text:'Cuidar de alguém também é uma forma de enfrentar o medo.',skills:'Intuição e Medicina',detail:'Você conhece a importância de agir quando cada segundo conta.'},{name:'Acalentador',icon:'◇',group:'Expressão',text:'Mesmo na escuridão, uma palavra pode oferecer abrigo.',skills:'Diplomacia e Intuição',detail:'Laços e escuta fazem parte da sua relação com o mundo.'}];
// Samples are presentation data. This file contains no rules engine or remote persistence.
const state={scene:'criacao',step:4,origin:0,name:'Helena Duarte',age:28,characterClass:'Combatente',query:'',category:'Todas',tab:'Identidade',gameTab:'Inventário',item:0,track:'Guerreiro',confirmed:false,resources:[18,12,4]};
let noticeTimer;
function notify(text){clearTimeout(noticeTimer);$('#notice').textContent=text;noticeTimer=setTimeout(()=>$('#notice').textContent='',4200)}
function heading(kicker,title,sub,meta='ARQ. 017 / ESTUDO 01'){return `<div class="heading"><div><div class="eyebrow">${kicker}</div><h1 style="margin-top:10px">${title}</h1><p class="muted">${sub}</p></div><div class="meta">${meta}</div></div>`}
function summary(extra=''){const o=origins[state.origin];return `<aside class="dossier" aria-label="Resumo do agente"><div class="eyebrow">Seu agente</div><div class="portrait" aria-hidden="true"><span>✧</span></div><h2>${escape(state.name)}</h2><p class="muted" style="margin:7px 0 14px">${state.characterClass} · Nível de exemplo 1</p><span class="tag">${state.scene==='criacao'?'Em criação':'Ficha de demonstração'}</span><hr class="divider"><dl class="facts"><div><dt>Idade</dt><dd>${state.age} anos</dd></div><div><dt>Origem</dt><dd>${o.name}</dd></div><div><dt>Patente</dt><dd>Recruta</dd></div></dl>${extra}<p class="example">Retrato, valores e escolhas são ilustrativos. Nenhum dado real é carregado.</p></aside>`}
function creation(){return heading('Criação de personagem',steps[state.step],`Etapa ${state.step+1} de 9 · Construa uma história. Faça uma escolha de cada vez.`)+`<div class="workspace"><nav class="steps" aria-label="Etapas da criação">${steps.map((s,i)=>`<button data-step="${i}" ${i===state.step?'aria-current="step"':''}><span>${String(i+1).padStart(2,'0')}</span>${s}</button>`).join('')}<p class="foot">Este estudo permite explorar as etapas sem finalizar uma ficha real.</p></nav><section class="panel">${creationContent()}<div class="actions"><button data-action="back" class="ghost" ${state.step===0?'disabled':''}>← Anterior</button><button data-action="next" class="primary">${state.step===8?'Concluir demonstração':'Continuar →'}</button></div></section>${summary(state.step===4?`<hr class="divider"><div class="eyebrow">Origem escolhida</div><h2 class="detail-title">${origins[state.origin].name}</h2><p class="muted" style="font-size:14px">${origins[state.origin].detail}</p><ul class="benefit"><li>Treinamentos ilustrados: ${origins[state.origin].skills}.</li><li>Consulte os efeitos completos na ficha real.</li></ul>`:'')}</div>`}
function creationContent(){
 if(state.step===4)return `<div class="section-head"><div><div class="eyebrow">Passado / 05</div><h2 style="margin-top:8px">De onde você veio?</h2><p class="muted">Escolha o passado que acompanha seu agente.</p></div></div><div class="toolbar"><label for="origin-search">Encontrar origem<input id="origin-search" type="search" placeholder="Buscar pelo nome…" value="${escape(state.query)}"></label><label for="category">Categoria<select id="category">${['Todas','Combate','Conhecimento','Expressão'].map(x=>`<option ${x===state.category?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="muted" id="result-count" style="font-size:13px;margin-bottom:12px"></p><div class="cards" id="origin-cards"></div><p class="note">A lista é um recorte visual. As escolhas e seus efeitos continuam sujeitos às regras do aplicativo.</p>`;
 const blocks=[
 `<h2>Quem é o seu agente?</h2><p class="scene-intro">Comece com um nome e uma idade. A história pode nascer aos poucos.</p><div class="form-grid"><label>Nome do agente<input id="agent-name" value="${escape(state.name)}" maxlength="80" required></label><label>Idade<input id="agent-age" type="number" min="16" max="120" value="${state.age}"></label></div>`,
 `<h2>Uma história antes do chamado</h2><p class="scene-intro">Como o tempo moldou seu agente?</p><div class="callout"><strong>Adulto — seleção ilustrativa</strong><p>Este estudo não aplica efeitos de estágio da vida nem habilita escolhas que estejam bloqueadas no aplicativo.</p></div>`,
 `<h2>Como você enfrenta o desconhecido?</h2><p class="scene-intro">Explore a apresentação das classes. Nenhum atributo será recalculado neste estudo.</p>${['Combatente','Especialista','Ocultista'].map((c,i)=>`<button class="choice" data-class="${c}" aria-pressed="${state.characterClass===c}"><span>${c}<small>${['Presença na linha de frente.','Conhecimento para cada situação.','Um olhar para além do comum.'][i]}</small></span><span class="check" aria-hidden="true">${state.characterClass===c?'✓':''}</span></button>`).join('')}`,
 `<h2>O que define seu agente?</h2><p class="scene-intro">Exemplo de leitura de atributos. A distribuição abaixo é apenas ilustrativa.</p><div class="statrow">${['AGI','FOR','INT','PRE','VIG'].map((a,i)=>`<div class="stat"><span>${a}</span><strong>${[2,2,2,1,2][i]}</strong></div>`).join('')}</div>`,
 '',
 `<h2>Conhecimento em ação</h2><p class="scene-intro">Os treinamentos aparecem agrupados para facilitar a escolha.</p><div class="callout"><strong>${origins[state.origin].skills}</strong><p>Exemplo associado à origem selecionada. Treinamentos não são concedidos neste estudo.</p></div>`,
 `<h2>Seu modo de agir</h2><p class="scene-intro">Habilidades serão apresentadas com requisitos e efeitos próximos da escolha.</p><div class="empty">Espaço para estudar a apresentação das habilidades da ficha real.</div>`,
 `<h2>Prepare-se para o desconhecido</h2><p class="scene-intro">Rituais e preparação devem mostrar as opções adequadas ao personagem.</p><div class="callout">Esta tela é um estudo de estrutura. Nenhum ritual ou benefício é concedido.</div>`,
 `<h2>Antes de partir</h2><p class="scene-intro">Confira a identidade que você explorou neste estudo.</p><dl class="facts"><div><dt>Nome</dt><dd>${escape(state.name)}</dd></div><div><dt>Classe</dt><dd>${state.characterClass}</dd></div><div><dt>Origem</dt><dd>${origins[state.origin].name}</dd></div></dl><p class="note">A conclusão encerra apenas a demonstração visual. Não cria uma ficha.</p>`];return blocks[state.step];
}
function originCards(){const visible=origins.map((o,i)=>({...o,i})).filter(o=>o.name.toLocaleLowerCase('pt-BR').includes(state.query.toLocaleLowerCase('pt-BR'))&&(state.category==='Todas'||o.group===state.category));$('#result-count').textContent=`${visible.length} origens neste estudo`;$('#origin-cards').innerHTML=visible.length?visible.map(o=>`<button class="origin-card" data-origin="${o.i}" aria-pressed="${o.i===state.origin}"><span class="card-icon" aria-hidden="true">${o.icon}</span><strong>${o.name}</strong><small>${o.text}</small></button>`).join(''):'<p class="empty">Nenhuma origem encontrada. Tente outro nome ou categoria.</p>'}
function office(){const tabs=['Identidade','Atributos','Habilidades','Rituais','Inventário','História'];return heading('Oficina do agente',escape(state.name),'Um lugar para organizar escolhas e desenvolver sua história.')+`<nav class="tabnav" aria-label="Seções da Oficina">${tabs.map(t=>`<button data-tab="${t}" ${state.tab===t?'aria-current="page"':''}>${t}</button>`).join('')}</nav><div class="split"><section class="panel"><div class="section-head"><h2>${state.tab}</h2><span class="tag">Estudo visual</span></div>${officeContent()}<div class="actions"><span class="muted" style="font-size:13px">Alterações apenas nesta demonstração</span><button class="primary" data-action="save">Aplicar no estudo</button></div></section>${summary()}</div>`}
function officeContent(){if(state.tab==='Identidade')return `<div class="form-grid"><label>Nome do agente<input id="agent-name" value="${escape(state.name)}" maxlength="80" required></label><label>Idade<input id="agent-age" type="number" min="16" max="120" value="${state.age}"></label><label>Classe<input value="${state.characterClass}" readonly></label><label>Origem<input value="${origins[state.origin].name}" readonly></label><div class="wide callout">Escolhas que afetam outros campos devem mostrar o impacto antes da confirmação.</div></div>`;if(state.tab==='Atributos')return `<p class="muted">Distribuição de exemplo; não calculada pelo motor do aplicativo.</p><div class="statrow">${['AGI','FOR','INT','PRE','VIG'].map((a,i)=>`<div class="stat"><span>${a}</span><strong>${[2,2,2,1,2][i]}</strong></div>`).join('')}</div>`;if(state.tab==='Inventário')return `<p class="scene-intro">Escolhas de equipamento podem ficar próximas das informações de uso.</p>${inventoryList()}`;if(state.tab==='História')return `<label>Sua história<textarea rows="8" placeholder="O que trouxe seu agente até aqui?">Um arquivo sem assinatura. Uma ligação interrompida. Helena ainda procura a conexão entre os dois.</textarea></label><p class="note">Texto fictício para avaliar leitura e edição.</p>`;return `<div class="empty">Nesta primeira direção visual, ${state.tab.toLowerCase()} aparece como área reservada. O catálogo real ainda não está representado.</div>`}
function evolution(){return heading('Evolução do agente','O próximo passo','Escolha um caminho. Confira o que muda antes de avançar.')+`<div class="split"><section class="panel"><div class="eyebrow">Progressão / demonstração</div><div class="evo-top"><div><p class="muted">Nível atual</p><div class="level">${state.confirmed?'2':'1'}</div></div><span class="arrow" aria-hidden="true">→</span><div style="text-align:right"><p class="muted">${state.confirmed?'Exemplo concluído':'Próximo nível'}</p><div class="level">2</div></div></div>${state.confirmed?'<h2>Escolha registrada no estudo</h2><p class="scene-intro">A ficha real não foi alterada. Você pode reiniciar este exemplo.</p><button class="primary" data-action="restart-evo">Reiniciar exemplo</button>':`<h2>Qual caminho você segue?</h2><p class="muted" style="margin:12px 0 18px">Duas alternativas ilustrativas para estudar a seleção de Trilha.</p>${['Guerreiro','Tropa de Choque'].map(t=>`<button class="choice" data-track="${t}" aria-pressed="${state.track===t}"><span>${t}<small>Consulte os requisitos e benefícios no aplicativo real.</small></span><span class="check" aria-hidden="true">${state.track===t?'✓':''}</span></button>`).join('')}<div class="actions"><span class="muted" style="font-size:13px">NEX e recursos permanecem separados.</span><button class="primary" data-action="confirm-evo">Confirmar no estudo →</button></div>`}</section><aside class="dossier"><div class="eyebrow">Resumo da escolha</div><h2 style="margin-top:14px">${state.track}</h2><hr class="divider"><dl class="facts"><div><dt>Próximo nível</dt><dd>2</dd></div><div><dt>NEX</dt><dd>Sem alteração neste exemplo</dd></div><div><dt>Recursos atuais</dt><dd>Preservados</dd></div></dl><p class="example">Este protótipo não verifica EM, requisitos ou benefícios. Sua finalidade é avaliar a clareza da escolha.</p></aside></div>`}
const items=[{name:'Proteção leve',type:'Proteção',icon:'◇',text:'Uma camada de proteção para enfrentar o que vem pela frente.'},{name:'Kit de investigação',type:'Equipamento',icon:'⌕',text:'Ferramentas reunidas para examinar pistas.'},{name:'Mochila',type:'Equipamento',icon:'▣',text:'Tudo o que você escolheu levar na missão.'}];
function inventoryList(){return `<div class="itemlist">${items.map((it,i)=>`<button class="item" data-item="${i}" aria-pressed="${state.item===i}"><span class="icon" aria-hidden="true">${it.icon}</span><span><strong>${it.name}</strong><small>${it.type} · Item de exemplo</small></span><span class="quantity">01 un.</span></button>`).join('')}</div>`}
function game(){const tabs=['Visão geral','Perícias','Habilidades','Rituais','Inventário','Personagem'];const it=items[state.item];return heading('Ficha de jogo · agente de exemplo',escape(state.name),`${state.characterClass} · Recruta · ${origins[state.origin].name}`)+`<section class="resources" aria-label="Recursos do agente">${['Vida','Sanidade','Esforço'].map((r,i)=>`<div class="resource"><div class="resource-head"><span class="eyebrow">${r}</span><strong><output id="resource-${i}">${state.resources[i]}</output><span> / ${[24,16,8][i]}</span></strong></div><div class="bar" aria-hidden="true"><i style="width:${Math.min(100,state.resources[i]/[24,16,8][i]*100)}%"></i></div><div class="resource-controls"><button data-resource="${i}" data-delta="-1" aria-label="Diminuir ${r}">−</button><span>Valor de exemplo</span><button data-resource="${i}" data-delta="1" aria-label="Aumentar ${r}">+</button></div></div>`).join('')}</section><nav class="tabnav" aria-label="Seções da ficha de jogo">${tabs.map(t=>`<button data-game-tab="${t}" ${state.gameTab===t?'aria-current="page"':''}>${t}</button>`).join('')}</nav>${state.gameTab==='Inventário'?`<div class="loadout"><section class="panel"><div class="section-head"><div><div class="eyebrow">O que você leva</div><h2 style="margin-top:8px">Inventário</h2></div><span class="muted">3 itens</span></div>${inventoryList()}<p class="note">Selecione um item para consultar os detalhes.</p></section><aside class="dossier"><div class="eyebrow">${it.type}</div><div class="portrait" aria-hidden="true"><span>${it.icon}</span></div><h2>${it.name}</h2><p class="muted" style="margin-top:14px">${it.text}</p><hr class="divider"><dl class="facts"><div><dt>Quantidade</dt><dd>1</dd></div><div><dt>Dados</dt><dd>Ilustrativos</dd></div></dl><p class="example">Sem cálculo de Defesa, bônus ou capacidade neste estudo.</p></aside></div>`:`<section class="panel"><h2>${state.gameTab}</h2><p class="scene-intro">A navegação e os recursos permanecem no mesmo lugar durante a consulta.</p>${state.gameTab==='Personagem'?`<dl class="facts"><div><dt>Nome</dt><dd>${escape(state.name)}</dd></div><div><dt>Origem</dt><dd>${origins[state.origin].name}</dd></div></dl>`:'<div class="empty">Conteúdo reservado para o próximo detalhamento visual desta seção.</div>'}</section>`}`}
function render(focusSelector){$('#main').innerHTML=({criacao:creation,oficina:office,evolucao:evolution,jogo:game})[state.scene]();$$('[data-scene]').forEach(b=>{if(b.dataset.scene===state.scene)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});if(state.scene==='criacao'&&state.step===4)originCards();if(focusSelector)$(focusSelector)?.focus({preventScroll:true})}
document.addEventListener('input',e=>{if(e.target.id==='origin-search'){state.query=e.target.value;originCards()}if(e.target.id==='agent-name')state.name=e.target.value;if(e.target.id==='agent-age'&&e.target.validity.valid)state.age=Number(e.target.value)});
document.addEventListener('change',e=>{if(e.target.id==='category'){state.category=e.target.value;originCards()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.scene){state.scene=b.dataset.scene;render();$('#main').focus();return}
 if(b.dataset.step!==undefined){state.step=Number(b.dataset.step);render(`[data-step="${state.step}"]`);return}
 if(b.dataset.origin!==undefined){state.origin=Number(b.dataset.origin);render(`[data-origin="${state.origin}"]`);return}
 if(b.dataset.class){state.characterClass=b.dataset.class;render(`[data-class="${state.characterClass}"]`);return}
 if(b.dataset.tab){state.tab=b.dataset.tab;render(`[data-tab="${state.tab}"]`);return}
 if(b.dataset.gameTab){state.gameTab=b.dataset.gameTab;render(`[data-game-tab="${state.gameTab}"]`);return}
 if(b.dataset.track){state.track=b.dataset.track;render(`[data-track="${state.track}"]`);return}
 if(b.dataset.item!==undefined){state.item=Number(b.dataset.item);render(`[data-item="${state.item}"]`);return}
 if(b.dataset.resource!==undefined){const i=Number(b.dataset.resource),delta=Number(b.dataset.delta);state.resources[i]=Math.max(0,state.resources[i]+delta);render(`[data-resource="${i}"][data-delta="${delta}"]`);notify('Recurso ajustado apenas nesta demonstração.');return}
 const action=b.dataset.action;
 if(action==='next'){if(state.step<8){state.step++;render('#main')}else notify('Demonstração concluída. Nenhuma ficha real foi criada.')}
 if(action==='back'){state.step=Math.max(0,state.step-1);render('#main')}
 if(action==='save'){const name=$('#agent-name'),age=$('#agent-age');if(name&&(!name.value.trim()||!age.reportValidity())){name.reportValidity();notify('Preencha o nome e uma idade válida.');return}if(name)state.name=name.value.trim();render('[data-action="save"]');notify('Aplicado somente neste estudo. Recarregar restaura os exemplos.')}
 if(action==='confirm-evo'){state.confirmed=true;render('[data-action="restart-evo"]');notify('Escolha ilustrativa confirmada. A ficha real não foi alterada.')}
 if(action==='restart-evo'){state.confirmed=false;render('[data-action="confirm-evo"]')}
});render();
</script>
</body>
</html>
