name: QA mãos FPS David Fischer v0.9.15
on:
  push:
    branches: [preview/fps-hands-david-v0915]
  pull_request:
    branches: [preview/viewmodel-pesquisado-v0914]
permissions:
  contents: read
jobs:
  fps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Checar código e estrutura
        run: npm run check
      - name: Compilar site
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Inspecionar GLB, rig, FPS visual e A/B
        run: npx playwright test tests/fps-david.spec.js tests/fps-art-variants.spec.js --workers=1 --retries=0 --reporter=line
      - name: Guardar capturas para revisão de enquadramento
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fps-david-v0915
          path: orion-observatorio-upload-github-leve/test-results/
          retention-days: 5
          if-no-files-found: ignore
