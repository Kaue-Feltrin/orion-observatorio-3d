name: QA benchmark mãos FPS v0.9.16
on:
  push:
    branches: [preview/benchmark-maos-fps-v0916]
  pull_request:
    branches: [preview/fps-hands-david-v0915]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar estrutura incluindo cálculos A/B
        run: npm run check
      - name: Compilar site
        run: npm run build
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testar painel A/B no build final
        run: npx playwright test tests/hands-benchmark.spec.js --workers=1 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-benchmark-maos
          path: orion-observatorio-upload-github-leve/test-results
          retention-days: 5
