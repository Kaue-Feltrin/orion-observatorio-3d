name: Validar viewmodel David Fischer
on:
  push:
    branches: [preview/fps-hands-david-v0915]
  pull_request:
    branches: [preview/viewmodel-pesquisado-v0914]
permissions:
  contents: read
jobs:
  fps-hands:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Capturar e validar modelo original e landmarks
        run: npx playwright test tests/fps-hands.spec.js --workers=1 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v0915-david-fps-capturas
          path: orion-observatorio-upload-github-leve/test-results
