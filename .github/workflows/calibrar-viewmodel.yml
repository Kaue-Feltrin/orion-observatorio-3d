name: Calibrar Viewmodel FPS
on:
  push:
    branches: [preview/viewmodel-pesquisado-v0914]
  pull_request:
    branches: [preview/maos-rig-gratuito-v0913]
permissions:
  contents: read
jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Medir enquadramento de punhos e dedos no viewport
        run: npx playwright test tests/framing-probe.spec.js --workers=1 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewmodel-fps-capturas
          path: orion-observatorio-upload-github-leve/test-results/*.png
