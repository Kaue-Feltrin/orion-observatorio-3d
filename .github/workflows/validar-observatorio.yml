name: Validar Observatório 3D

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar estrutura e sintaxe
        run: npm run check
      - name: Compilar site
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testar WebGL, paralaxe e Nebulosa Viva no navegador
        run: npx playwright test --grep "diagnostico de inicializacao" --retries=0
      - name: Guardar capturas se houver falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-debug-${{ github.run_id }}
          path: |
            orion-observatorio-upload-github-leve/test-results/
            orion-observatorio-upload-github-leve/playwright-report/
          if-no-files-found: ignore
