name: Validar Observatório 3D

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar estrutura e sintaxe
        run: npm run check
      - name: Verificar rig 2,5D das imagens
        run: |
          node tests/hands-image-rig.unit.mjs
          node tests/hands-perspective.unit.mjs
          node tests/star-selection.unit.mjs
          node tests/selection-handoff.unit.mjs
          node tests/herald-navigation.unit.mjs
          node tests/creation-state.unit.mjs
          node tests/creation-fracture.unit.mjs
          node tests/creation-body-rig.unit.mjs
          node tests/creation-sigils.unit.mjs
          node tests/creation-environment.unit.mjs
          node tests/mobile-constellation.unit.mjs
          node tests/distant-sky.unit.mjs
          node tests/journey-motion.unit.mjs
          node tests/hands-balance.unit.mjs
          node tests/nebula-volume.unit.mjs
      - name: Compilar site
        run: npm run build

      - name: Instalar Chromium do Playwright
        run: npx playwright install --with-deps chromium
      - name: Testar WebGL, paralaxe e Nebulosa Viva no navegador
        run: npm run test:browser
      - name: Guardar evidências visuais e relatórios dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observatorio-evidencias-${{ github.run_id }}
          path: |
            orion-observatorio-upload-github-leve/test-results/
            orion-observatorio-upload-github-leve/playwright-report/
          retention-days: 3
          if-no-files-found: ignore
