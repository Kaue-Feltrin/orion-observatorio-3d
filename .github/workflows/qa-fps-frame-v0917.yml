name: QA pose C das mãos FPS v0.9.17
on:
  push:
    branches: [preview/fps-frame-hands-v0917]
  pull_request:
    branches: [preview/benchmark-maos-fps-v0916]
permissions:
  contents: read
jobs:
  hands-frame:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: orion-observatorio-upload-github-leve
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar estrutura e sintaxe
        run: npm run check
      - name: Build de produção
        run: npm run build
      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium
      - name: Renderizar nova pose em 1755x865 e 1920x951
        run: npx playwright test tests/fps-frame.spec.js --workers=1 --retries=0 --reporter=line
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fps-frame-v0917-screenshots
          path: |
            orion-observatorio-upload-github-leve/test-results/
          retention-days: 7
          if-no-files-found: ignore
