<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Órion · cinco camadas</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0b10;color:#ddd8e2;font:14px system-ui}main{display:grid;grid-template-columns:300px 1fr;min-height:100svh}aside{padding:28px 24px}h1{font:25px Georgia;margin:0 0 15px}p{color:#aaa2b0;line-height:1.6}label{display:block;padding:13px 0;border-bottom:1px solid #ffffff15}input{accent-color:#cfa65f;margin-right:10px}a{color:#d4b77f;font-size:11px;display:block;margin:6px 0 0 27px}button{margin-top:20px;border:1px solid #bda27577;background:#211b28;color:#eee0c9;padding:10px 14px;border-radius:4px;cursor:pointer}#scene{position:relative;align-self:center;aspect-ratio:3/2;overflow:hidden;background:repeating-conic-gradient(#1e1e23 0 25%,#292930 0 50%) 0/24px 24px}img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.red{filter:brightness(.75);opacity:.64;transform-origin:20% 75%}.red2{opacity:.59;transform-origin:80% 22%}.gray1{opacity:.30}.gray2{opacity:.21}.pulse .red{animation:breath 4.8s ease-in-out infinite}img[hidden]{display:none}@keyframes breath{0%,100%{filter:saturate(.3) brightness(.75);transform:scale(1)}50%{filter:saturate(1) brightness(.75);transform:scale(1.02)}}@media(max-width:800px){main{display:flex;flex-direction:column-reverse;min-height:0}#scene{width:100%}aside{padding:22px}}@media(prefers-reduced-motion:reduce){.pulse .red{animation:none}}
</style><main><aside><h1>Cinco camadas</h1><p>Ative cada arquivo separadamente para conferir a transparência e a composição.</p><div id="controls"></div><button id="pulse" aria-pressed="false">Ativar pulsação de exemplo</button><p>As duas névoas e as duas membranas são arquivos transparentes diferentes. A base é preta sólida.</p></aside><section id="scene" aria-label="Composição das cinco camadas"></section></main><script>
const files=[['Preto · base','black-base-v9.svg',''],['Cinza · distante','gray-far-v9.png','gray1'],['Cinza · próximo','gray-near-v9.png','gray2'],['Vermelho · inferior esquerdo','red-left-v14.png','red'],['Vermelho · superior direito','red-right-v14.png','red red2']];
files.forEach(([name,file,cls],i)=>{const img=new Image();img.src='assets/creation/'+file;img.alt='';img.className=cls;scene.append(img);const label=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.checked=true;check.setAttribute('aria-label',name);check.onchange=()=>img.hidden=!check.checked;label.append(check,document.createTextNode(name));const a=document.createElement('a');a.href=img.src;a.download=file;a.textContent='Baixar '+file;label.append(a);controls.append(label)});
pulse.onclick=()=>{const on=scene.classList.toggle('pulse');pulse.setAttribute('aria-pressed',on);pulse.textContent=on?'Pausar pulsação':'Ativar pulsação de exemplo'};
</script></html>
